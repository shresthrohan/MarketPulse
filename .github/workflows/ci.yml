name: ci

# Every push and PR: lint + unit tests, Spark tests, frontend checks, the full stack with integration
# tests and failure drills, and the production configuration booted behind HTTPS.
# Deploy runs only on main, only after all of that passed, and only when a server is configured
# (repository variable DEPLOY_HOST); without one it is skipped.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*/requirements*.txt"
      - name: Install (pinned by the lock files the images use)
        run: |
          for s in ingestion processing backend; do
            pip install -r $s/requirements.txt -r $s/requirements-dev.txt -c $s/requirements.lock
          done
      - name: Lint
        run: pip install ruff==0.8.4 && ruff check --select E,F,W,B,UP --ignore E501,B008,UP038 ingestion processing backend scripts spark
      - name: Unit tests (ingestion, processing, backend, seed)
        run: pytest -q ingestion/tests processing/tests/test_pure.py processing/tests/test_processor.py backend/tests/unit scripts/test_seed.py
        env:
          PYTHONPATH: .:backend

  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Spark job tests (windows, VWAP, dedup, invalid records, watermark)
        run: docker run --rm -v "$PWD/spark:/opt/marketpulse" -w /opt/marketpulse apache/spark:3.5.3-python3 sh run_tests.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure (simulator only; binance.com refuses the US-hosted runners)
        run: |
          cp .env.example .env
          sed -i 's/^PROVIDERS=.*/PROVIDERS=simulator/' .env
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 600
        timeout-minutes: 15
      - name: Wait for events to flow through the pipeline
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8000/api/pipeline/overview | grep -q '"events_processed":[1-9]' && exit 0
            sleep 2
          done
          exit 1
      - name: Models match migrations
        run: docker compose exec -T backend alembic check
      - name: Backend integration tests
        run: docker compose exec -T backend pytest tests/integration -q
      - name: Processing integration tests
        run: docker compose run --rm processing pytest processing/tests/test_integration.py -q
      - name: Failure drills (Redis outage/data loss, processor kill, offset rewind, PostgreSQL/backend/Kafka restarts)
        run: python3 scripts/failure_drills.py
      - name: Backup and restore check
        run: scripts/backup.sh && scripts/restore.sh "$(ls -1t backups/*.dump | head -1)"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  production-config:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production
    steps:
      - uses: actions/checkout@v4
      - name: Configure production stack for localhost (Caddy issues a local-CA certificate)
        run: |
          cp deploy/.env.production.example .env.production
          sed -i "s/^PUBLIC_HOST=.*/PUBLIC_HOST=localhost/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/; s/^PROVIDERS=.*/PROVIDERS=simulator/" .env.production
      - name: Build runtime images and start
        run: $PROD up -d --build --wait --wait-timeout 600
        timeout-minutes: 20
      - name: HTTPS, WSS, health and exposure checks
        run: |
          curl -fsSk https://localhost/api/health | tee /dev/stderr | grep -q '"status"'
          for p in database redis kafka; do curl -fsSk "https://localhost/api/health/$p" > /dev/null; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"   # HTTP redirects to HTTPS
          curl -sIk https://localhost/ | grep -qi '^strict-transport-security'
          ! curl -s --max-time 3 localhost:8000 > /dev/null    # API not published
          ! curl -s --max-time 3 localhost:8080 > /dev/null    # nginx not published
          docker run --rm --network host -e NODE_TLS_REJECT_UNAUTHORIZED=0 node:22-alpine node -e "
            const ws = new WebSocket('wss://localhost/ws/market');
            ws.onopen = () => ws.send(JSON.stringify({action: 'subscribe', symbols: ['*']}));
            ws.onmessage = (e) => { if (JSON.parse(e.data).type === 'quote') process.exit(0); };
            setTimeout(() => process.exit(1), 30000);"
      - name: Runtime images carry no tests or test tooling
        run: |
          ! docker run --rm --entrypoint python marketpulse-backend:prod -c "import pytest"
          ! docker run --rm --entrypoint ls marketpulse-backend:prod /srv/backend/tests
      - name: Logs
        if: failure()
        run: $PROD logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: $PROD down -v

  deploy:
    # Only main, only after every check, only when a server is configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: [python, spark, frontend, integration, production-config]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST }}
    concurrency: {group: deploy-production, cancel-in-progress: false}
    steps:
      - name: Deploy this commit over SSH (server builds it, smoke-tests it, rolls back on failure)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "${{ vars.DEPLOY_USER || 'deploy' }}@${{ vars.DEPLOY_HOST }}" \
            "cd /opt/marketpulse && scripts/deploy.sh ${{ github.sha }}"
      - name: Verify from outside
        run: curl -fsS "https://${{ vars.DEPLOY_HOST }}/api/health"
