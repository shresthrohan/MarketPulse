# Production overlay (single host). Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build --wait
#
# Differences from the base (development) stack:
# - Caddy terminates HTTPS (automatic Let's Encrypt certificate for PUBLIC_HOST) and is the only
#   service publishing ports. PostgreSQL, Redis, Kafka and the API are reachable only on the
#   internal Docker network.
# - Slim `runtime` images: no tests, no test tooling.
# - restart: always, memory limits sized for a 4 GB host, real client IPs for rate limiting.

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  postgres:
    restart: always
    environment:
      # timescaledb-tune sizes shared_buffers etc. at first init: tune for the limit, not the host.
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "2"
    deploy: {resources: {limits: {memory: 1g}}}

  redis:
    restart: always
    deploy: {resources: {limits: {memory: 320m}}}

  kafka:
    restart: always
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    deploy: {resources: {limits: {memory: 900m}}}

  migrate:
    build: {target: runtime}
    image: marketpulse-backend:prod

  ingestion:
    build: {target: runtime}
    image: marketpulse-ingestion:prod
    restart: always
    deploy: {resources: {limits: {memory: 256m}}}

  processing:
    build: {target: runtime}
    image: marketpulse-processing:prod
    restart: always
    deploy: {resources: {limits: {memory: 384m}}}

  backend:
    build: {target: runtime}
    image: marketpulse-backend:prod
    ports: !reset []
    environment:
      # The browser reaches the API same-origin through Caddy and nginx.
      CORS_ORIGINS: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env.production}
      # Trust X-Forwarded-For only from the proxies on this private network, so rate limits and
      # WebSocket caps apply to the real client address (spoofed headers from clients are ignored).
      FORWARDED_ALLOW_IPS: 172.28.0.0/16
    restart: always
    deploy: {resources: {limits: {memory: 768m}}}

  frontend:
    ports: !reset []
    restart: always
    deploy: {resources: {limits: {memory: 64m}}}

  caddy:
    image: caddy:2.9-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env.production}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates and ACME account: keep, or Let's Encrypt rate limits bite
      - caddy_config:/config
    depends_on:
      frontend: {condition: service_healthy}
    logging: *logging
    restart: always
    deploy: {resources: {limits: {memory: 128m}}}

networks:
  default:
    ipam:
      config: [{subnet: 172.28.0.0/16}]

volumes:
  caddy_data:
  caddy_config:
